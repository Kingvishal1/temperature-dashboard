<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Temp Dashboard</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:16px}
    h1{margin-bottom:8px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
    .card{border-radius:12px;padding:12px;box-shadow:0 2px 6px rgba(0,0,0,0.08)}
    .label{font-size:14px;color:#666}
    .temp{font-size:28px;font-weight:700}
    .ts{font-size:12px;color:#888}
    .battery{font-size:13px;color:#444;margin-top:6px}
    .battery .percent{font-weight:700}
    canvas{width:100%;height:200px}
    .room-card{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;margin-bottom:16px}
    .room-card .label{color:#fff;opacity:0.9;font-size:16px;font-weight:600}
    .room-card .temp{color:#fff;font-size:36px}
    .room-card .humidity{color:#fff;font-size:18px;margin-top:8px;opacity:0.95}
    .room-card .ts{color:#fff;opacity:0.8}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>Room Temperature (DHT22 Sensor)</h1>
  <div id="room-card"></div>
  <h1>Temps (phone, laptop, mac, rpi)</h1>
  <div id="cards" class="grid"></div>
  <h2>History (last 60 samples per device)</h2>
  <div id="charts" class="grid"></div>

<script>
const api = "/api/temps";
const roomApi = "/api/room";
const pollMs = 5000; // 5s
let history = {}; // device -> [ {ts, temp, batteryPercent|null} ]
const maxPoints = 60;

async function pollRoom(){
  try{
    const r = await fetch(roomApi);
    const data = await r.json();

    const roomCardContainer = document.getElementById("room-card");

    if(data.temperature !== null && data.humidity !== null){
      roomCardContainer.innerHTML = `
        <div class="card room-card">
          <div class="label">Room Temperature & Humidity</div>
          <div class="temp">${Number(data.temperature).toFixed(1)} °C</div>
          <div class="humidity">Humidity: ${Number(data.humidity).toFixed(1)}%</div>
          <div class="ts">${data.timestamp ? new Date(data.timestamp).toLocaleString() : 'No data'}</div>
        </div>`;
    } else {
      roomCardContainer.innerHTML = `
        <div class="card room-card">
          <div class="label">Room Temperature & Humidity</div>
          <div class="temp">— °C</div>
          <div class="humidity">Humidity: — %</div>
          <div class="ts">Waiting for sensor data...</div>
        </div>`;
    }
  } catch(e){
    console.error("room poll error", e);
  }
}

function createCard(device){
  const card = document.createElement("div");
  card.className="card";
  card.id="card-"+device;
  card.innerHTML = `<div class="label">${device}</div>
    <div class="temp" id="temp-${device}">— °C</div>
    <div class="ts" id="ts-${device}"></div>
    <div class="battery" id="battery-${device}"></div>`;
  return card;
}

function createChartCanvas(device){
  const card = document.createElement("div");
  card.className="card";
  card.innerHTML = `<div class="label">${device} history</div>
    <canvas id="chart-${device}"></canvas>`;
  return card;
}

const charts = {}; // device -> Chart

function makeDatasets(deviceHistory){
  // deviceHistory = [{ts: Date, temp: number, battery: number|null}, ...]
  const tempData = deviceHistory.map(x => x.temp);
  const labels = deviceHistory.map(x => x.ts.toLocaleTimeString());
  // battery may be all null or mixed
  const batteryData = deviceHistory.some(x => x.battery !== null) ? deviceHistory.map(x => x.battery === null ? null : x.battery) : null;

  const datasets = [{
    label: 'Temperature (°C)',
    data: tempData,
    yAxisID: 'y',
    fill: false,
    tension: 0.2,
    borderWidth: 2,
    pointRadius: 1
  }];

  if (batteryData) {
    datasets.push({
      label: 'Battery (%)',
      data: batteryData,
      yAxisID: 'y1',
      fill: false,
      tension: 0.2,
      borderDash: [6,4],
      borderWidth: 2,
      pointRadius: 1
    });
  }

  return { labels, datasets };
}

async function poll(){
  // Poll room data
  pollRoom();

  try{
    const r = await fetch(api);
    const j = await r.json();
    // Clear containers (we'll re-create; this keeps DOM simple)
    document.getElementById("cards").innerHTML = "";
    document.getElementById("charts").innerHTML = "";

    for(const device in j){
      const d = j[device];

      // normalize battery fields
      let batteryPercent = null;
      let batteryStatus = null;
      if (d.battery) {
        if (typeof d.battery === 'number') {
          batteryPercent = d.battery;
        } else if (typeof d.battery === 'object') {
          if (d.battery.percent !== undefined && d.battery.percent !== null) {
            batteryPercent = Number(d.battery.percent);
            if (Number.isNaN(batteryPercent)) batteryPercent = null;
          }
          if (d.battery.status !== undefined) batteryStatus = d.battery.status;
        }
      }

      // card
      const card = createCard(device);
      document.getElementById("cards").appendChild(card);
      document.getElementById("temp-"+device).innerText = Number(d.temp_c).toFixed(1) + " °C";
      document.getElementById("ts-"+device).innerText = new Date(d.ts).toLocaleString();

      // battery text
      const battEl = document.getElementById("battery-"+device);
      if (batteryPercent !== null) {
        battEl.innerHTML = `Battery: <span class="percent">${batteryPercent.toFixed(0)}%</span>${batteryStatus ? " — " + batteryStatus : ""}`;
      } else if (batteryStatus) {
        battEl.innerHTML = `Battery: ${batteryStatus}`;
      } else {
        battEl.innerHTML = '';
      }

      // add to history
      if(!history[device]) history[device]=[];
      history[device].push({ts:new Date(d.ts), temp: Number(d.temp_c), battery: batteryPercent});
      if(history[device].length>maxPoints) history[device].shift();

      // chart
      if(!charts[device]){
        const chartCard = createChartCanvas(device);
        document.getElementById("charts").appendChild(chartCard);
        const ctx = document.getElementById("chart-"+device).getContext('2d');

        const { labels, datasets } = makeDatasets(history[device]);

        charts[device] = new Chart(ctx, {
          type:'line',
          data:{
            labels: labels,
            datasets: datasets
          },
          options:{
            animation:false,
            interaction: { mode: 'index', intersect: false },
            scales: {
              y: { // left axis - temperature
                type: 'linear',
                position: 'left',
                title: { display: true, text: '°C' }
              },
              y1: { // right axis - battery percent
                type: 'linear',
                position: 'right',
                min: 0,
                max: 100,
                title: { display: true, text: '%' },
                grid: { drawOnChartArea: false } // avoid grid overlap
              }
            },
            plugins: {
              legend: { display: true }
            }
          }
        });
      } else {
        const ch = charts[device];
        const { labels, datasets } = makeDatasets(history[device]);

        ch.data.labels = labels;
        // Ensure datasets length and order matches: replace datasets fully
        ch.data.datasets = datasets;
        ch.update();
      }
    }
  } catch(e){
    console.error("poll error",e);
  } finally {
    setTimeout(poll, pollMs);
  }
}

poll();
</script>
</body>
</html>
